<div class="max-w-2xl mx-auto space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-900">Add Employee</h2>
    <p class="text-gray-600">Create a new employee account.</p>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-6">
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <div class="flex justify-end gap-4">
        <button mat-button type="button" (click)="employeeForm.reset()">Clear</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="!employeeForm.valid">
          Create Account
        </button>
      </div>
      
    </form>
  </div>
</div>
