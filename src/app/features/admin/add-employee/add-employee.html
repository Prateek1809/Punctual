<div class="max-w-2xl mx-auto space-y-6 animate-in fade-in duration-300">
  <div>
    <h2 class="text-2xl sm:text-3xl font-extrabold text-[#1F2937] dark:text-[#f8fafc] tracking-tight">Add Employee</h2>
    <p class="text-[#4B5563] dark:text-[#94a3b8] text-sm mt-0.5">Create a new employee account.</p>
  </div>

  <div class="surface !p-6 sm:!p-8">
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
        <mat-form-field appearance="outline" class="w-full">
          <input matInput formControlName="name" placeholder="John Doe">
        </mat-form-field>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
        <mat-form-field appearance="outline" class="w-full">
          <input matInput type="email" formControlName="email" placeholder="john@company.com">
        </mat-form-field>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Password</label>
        <mat-form-field appearance="outline" class="w-full">
          <input matInput type="password" formControlName="password" placeholder="••••••••">
        </mat-form-field>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="employeeForm.reset()" class="soft-btn !py-2 !px-4 text-xs font-semibold text-slate-600">Clear</button>
        <button type="submit" [disabled]="!employeeForm.valid" class="soft-btn-primary !h-11 !px-6 text-xs font-bold">
          Create Account
        </button>
      </div>
      
    </form>
  </div>
</div>
