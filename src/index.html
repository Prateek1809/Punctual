<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Punctual — Enterprise Attendance & Leave System</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Punctual: Modern PWA for employee attendance tracking, office geofence verification, and leave management." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="app-icon.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      try {
        if (localStorage.getItem('punctual_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased text-[#1F2937] bg-[#F0F4F8]">
    <app-root></app-root>
  </body>
</html>
