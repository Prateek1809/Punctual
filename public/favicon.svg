<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Clock Ring Outer Glow -->
  <circle cx="56" cy="64" r="38" fill="none" stroke="url(#neonGlow)" stroke-width="5" filter="url(#glow)" opacity="0.4"/>
  <circle cx="56" cy="64" r="38" fill="none" stroke="url(#neonGlow)" stroke-width="5"/>

  <!-- Clock Tick Marks -->
  <line x1="56" y1="32" x2="56" y2="38" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="64" x2="30" y2="64" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="96" x2="56" y2="90" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Clock Hands (10:10 start time representation) -->
  <line x1="56" y1="64" x2="42" y2="48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="56" y1="64" x2="72" y2="48" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="56" cy="64" r="4.5" fill="#ffffff"/>

  <!-- Checkmark Pin Overlay on the Right -->
  <g transform="translate(62, 38)">
    <!-- Location Pin Bulb with Checkmark -->
    <path d="M 18,2 C 7,2 0,10 0,22 C 0,34 16,52 18,54 C 20,52 36,34 36,22 C 36,10 29,2 18,2 Z" 
          fill="url(#pinGrad)" filter="url(#glow)" opacity="0.35"/>
    <path d="M 18,2 C 7,2 0,10 0,22 C 0,34 16,52 18,54 C 20,52 36,34 36,22 C 36,10 29,2 18,2 Z" 
          fill="#0f172a" stroke="url(#pinGrad)" stroke-width="3"/>
    
    <!-- Verified Checkmark Inside Pin -->
    <path d="M 11,21 L 16,26 L 26,16" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
